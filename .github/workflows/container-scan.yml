name: Container Image Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: vulnapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-scan:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Qualys Container Scan
        uses: nelssec/qualys-container-scan@v1
        with:
          qualys_access_token: ${{ secrets.QUALYS_ACCESS_TOKEN }}
          qualys_pod: ${{ vars.QUALYS_POD }}
          image_id: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          max_critical: -1
          max_high: -1
          continue_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
