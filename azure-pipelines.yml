trigger: none

pool: ado-qualys

steps:
  - script: |
      npm install
    displayName: 'Install npm dependencies'
    continueOnError: true

  - task: QualysCodeScan@2
    displayName: 'Qualys Code Scan (SCA)'
    inputs:
      qualysConnection: 'QualysConnection'
      scanPath: '$(Build.SourcesDirectory)'
      usePolicyEvaluation: false
      maxCritical: 1
      maxHigh: -1
      generateSbom: true
    continueOnError: true

  - script: |
      docker build --no-cache -t vulnapp:$(Build.BuildId) -f Dockerfile .
      echo "Built image: vulnapp:$(Build.BuildId)"
      docker images | grep vulnapp
    displayName: 'Build Docker Image'
    workingDirectory: '$(Build.SourcesDirectory)'
    continueOnError: true

  - task: QualysContainerScan@2
    displayName: 'Qualys Container Scan'
    inputs:
      qualysConnection: 'QualysConnection'
      imageId: 'vulnapp:$(Build.BuildId)'
      usePolicyEvaluation: false
      maxCritical: 1
      maxHigh: -1
    continueOnError: true
