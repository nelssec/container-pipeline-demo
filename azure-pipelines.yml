trigger: none

pool: ado-qualys

steps:
  - script: |
      npm install
    displayName: 'Install npm dependencies'
    continueOnError: true

  - task: QualysSCAScan@2
    displayName: 'Qualys SCA Scan (Source)'
    inputs:
      qualysConnection: 'QualysConnection'
      scanPath: '$(Build.SourcesDirectory)'
      usePolicyEvaluation: false
      failOnSeverity: '4'
      generateSbom: true
    continueOnError: true

  - script: |
      docker build -t vulnapp:$(Build.BuildId) -f Dockerfile .
      echo "Built image: vulnapp:$(Build.BuildId)"
      docker images | grep vulnapp
    displayName: 'Build Docker Image'
    workingDirectory: '$(Build.SourcesDirectory)'
    continueOnError: true

  - task: QualysContainerScan@2
    displayName: 'Qualys Container Scan'
    inputs:
      qualysConnection: 'QualysConnection'
      imageId: 'vulnapp:$(Build.BuildId)'
      usePolicyEvaluation: false
      failOnSeverity: '4'
    continueOnError: true
