trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'vulnerable-demo-app'
  imageTag: '$(Build.BuildId)'

steps:
  # Build the Docker image
  - task: Docker@2
    displayName: 'Build Docker Image'
    inputs:
      command: 'build'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      repository: '$(imageName)'
      tags: |
        $(imageTag)
        latest

  # Scan the container image with Qualys
  - task: QualysContainerScan@2
    displayName: 'Qualys Container Security Scan'
    inputs:
      qualysConnection: 'QualysConnection'
      imageName: '$(imageName):$(imageTag)'
      failOnSeverity: '4'
      generateReport: true

  # Also run SCA scan on the source code
  - task: QualysSCAScan@2
    displayName: 'Qualys SCA Scan'
    inputs:
      qualysConnection: 'QualysConnection'
      scanPath: '$(Build.SourcesDirectory)'
      usePolicyEvaluation: false
      failOnSeverity: '4'
      generateSbom: true
